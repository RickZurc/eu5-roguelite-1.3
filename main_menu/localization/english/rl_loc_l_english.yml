 rl_events.1.reroll.tt: "Spend one banked reroll token to discard these three offers and draw three new ones. Earn tokens by winning great battles."
 rl_events.1.banish.tt: "Spend one token to remove this upgrade from your pool #R permanently#! (you will never be offered it again), then redraw three new options."

