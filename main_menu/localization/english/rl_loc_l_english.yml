 # Token shop
 rl_status.5.title: "The Token Shop"
 rl_status.5.desc: "You have #Y [GetPlayer.MakeScope.GetVariable('rl_reroll_tokens').GetValue]#! reroll tokens. Spend them here, or save them to reroll and banish upgrades."
 rl_status.5.cleanse: "Cleanse my curses #R (3 tokens)#!"
 rl_status.5.cleanse.tt: "Remove #R all curse penalties#! currently afflicting your realm. Costs 3 tokens."
 rl_status.5.legendary: "Ordain a great work #P (5 tokens)#!"
 rl_status.5.legendary.tt: "Your #P next upgrade selection is guaranteed Legendary#! (5x power, or a legendary artifact). Costs 5 tokens."
 rl_status.5.extra: "Seize an opportunity #Y (4 tokens)#!"
 rl_status.5.extra.tt: "Draw an #Y extra upgrade selection right now#!. Costs 4 tokens."
 rl_status.5.close: "Close"
 rl_status.1.desc: "#T Resources#!\n Reroll tokens: #Y [GetPlayer.MakeScope.GetVariable('rl_reroll_tokens').GetValue]#!  (spent on Reroll and Banish; earned by winning great battles)\n Upgrades taken: [GetPlayer.MakeScope.GetVariable('rl_threat').GetValue]\n Notoriety tier rises at 5 / 10 / 20 / 35 / 55 upgrades.\n\n#T Synergy Progress#!  (set bonuses at 4 / 8 / 12 of a theme)\n #R Military#!: [GetPlayer.MakeScope.GetVariable('rl_tag_military').GetValue]\n #B Naval#!: [GetPlayer.MakeScope.GetVariable('rl_tag_naval').GetValue]\n #Y Economic#!: [GetPlayer.MakeScope.GetVariable('rl_tag_economic').GetValue]\n #P Administrative#!: [GetPlayer.MakeScope.GetVariable('rl_tag_admin').GetValue]"

 dummy_parent_advance: "Roguelite Unlock System (Ignore)"
 dummy_parent_advance_desc: "Do not research this technology. It will be unlocked automatically after 1 month (it will not actually give you an extra technology roll)."

 # Community Mod Menu settings
 europa_survivors__general_name: "Roguelike Universalis"
 europa_survivors__general__sources_name: "Roll Sources"
 europa_survivors__roll_on_research_name: "Rolls from Research"
 europa_survivors__roll_on_research_desc: "Gain an upgrade selection each time you research an advance."
 europa_survivors__roll_on_battle_name: "Reroll Tokens from Battles"
 europa_survivors__roll_on_battle_desc: "Winning a great battle grants a banked reroll token you can spend on future upgrade selections."
 europa_survivors__roll_on_new_age_name: "Rolls from New Ages"
 europa_survivors__roll_on_new_age_desc: "Gain an upgrade selection when a new age begins (guaranteed legendary)."
 europa_survivors__general__gameplay_name: "Gameplay"
 europa_survivors__enable_reroll_name: "Allow Rerolls"
 europa_survivors__enable_reroll_desc: "Adds a Reroll option to each selection, letting you replace the three offers once per roll."
 europa_survivors__enable_cursed_name: "Cursed Rolls"
 europa_survivors__enable_cursed_desc: "Rare and legendary rolls can become cursed: the upgrade is stronger, but taking any option also inflicts a lasting drawback."
 europa_survivors__enable_sets_name: "Synergy Sets"
 europa_survivors__enable_sets_desc: "Upgrades are tagged Military / Naval / Economic / Administrative. Collecting 4, 8, and 12 of a theme grants escalating set bonuses."
 europa_survivors__enable_threat_name: "Escalating Threat"
 europa_survivors__enable_threat_desc: "The more upgrades you take, the more the world distrusts your rising power: a growing Notoriety penalty to reputation and antagonism."
 europa_survivors__enable_banish_name: "Allow Banishing"
 europa_survivors__enable_banish_desc: "Adds a Banish action to each offered upgrade: spend a reroll token to remove it from your pool permanently, then redraw."
 europa_survivors__enable_artifacts_name: "Legendary Artifacts"
 europa_survivors__enable_artifacts_desc: "Legendary rolls have a 50% chance to instead offer a unique artifact: a bespoke, very powerful perk claimable only once per campaign (12 in total)."